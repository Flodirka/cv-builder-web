name: Bug report
description: Report a reproducible problem with the public browser editor.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include a real resume, personal contact details, files, or screenshots containing private data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 144 or Chrome 140
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Use fictional data only.
