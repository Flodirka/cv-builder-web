name: Deploy CV Builder Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Verify source and dependencies
        run: |
          npm run security:self-test
          npm run boundary
          npm run typecheck
          npm test
          npm run lint
          npm run format
          npm audit --omit=dev --audit-level=high
      - name: Build static site
        env:
          CV_BUILDER_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - name: Scan and exercise static artifact
        env:
          CV_BUILDER_QA_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm run security:check
          npm run qa:static
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
